name: Build & Deploy Test Site (dev branch)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          VITE_API_URL: https://uhxejjh8s1.execute-api.us-east-1.amazonaws.com/dev
          VITE_APP_URL: https://apptest.tipwave.live

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 (marketing-test)
        run: |
          aws s3 sync dist/ s3://tipwave-sites-bucket/marketing-test/ \
            --delete \
            --cache-control "max-age=3600" \
            --exclude "*.html" \
            --exclude ".DS_Store"

          # HTML files are never cached so changes show up straight away
          aws s3 sync dist/ s3://tipwave-sites-bucket/marketing-test/ \
            --include "*.html" \
            --cache-control "max-age=0, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront (test)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ERGRW7CDT7KOU \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "Test site deployed: https://test.tipwave.live"
